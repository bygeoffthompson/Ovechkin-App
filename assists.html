    <script>
        async function fetchDataAndCreateTable() {
            try {
                const response = await fetch('/goals.json');
                const data = await response.json();

                const leagueMap = {
                    1:        'nhlReg',
                    2:        'nhlPlayoff',
                    3:                'khl',
                    4:            'olympic',
                    5: 'wc',
                    6:          'wcup'
                };

                const counts = {};
                data.forEach(item => {
                    if (typeof item.goal !== 'number' || !isFinite(item.goal)) return;
                    const key = leagueMap[item.league];
                    if (!key) return;
                    if (item.a1) {
                        if (!counts[item.a1]) counts[item.a1] = {};
                        counts[item.a1][key + 'A1'] = (counts[item.a1][key + 'A1'] || 0) + 1;
                    }
                    if (item.a2) {
                        if (!counts[item.a2]) counts[item.a2] = {};
                        counts[item.a2][key + 'A2'] = (counts[item.a2][key + 'A2'] || 0) + 1;
                    }
                });

                function formulaCell(row, p, s) {
                    const cell = row.insertCell();
                    cell.setAttribute('data-order', p + s);
                    cell.innerHTML = p + s > 0 ? `<small><small title="Primary">${p}</small> + <small title="Secondary">${s}</small> =</small> <strong>${p + s}</strong>` : '<span class="opacity-25">0</span>';
                }

                const tableBody = document.querySelector('tbody');
                Object.entries(counts).forEach(([player, c]) => {
                    const row = tableBody.insertRow();
                    const playerCell = row.insertCell();
                    const link = document.createElement('a');
                    link.textContent = player;
                    link.href = '/?' + player.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, '-');
                    playerCell.appendChild(link);
                    formulaCell(row, c.nhlRegA1 || 0,    c.nhlRegA2 || 0);
                    formulaCell(row, c.nhlPlayoffA1 || 0, c.nhlPlayoffA2 || 0);
                    formulaCell(row, c.khlA1 || 0,       c.khlA2 || 0);
                    formulaCell(row, c.olympicA1 || 0,   c.olympicA2 || 0);
                    formulaCell(row, c.wcA1 || 0,        c.wcA2 || 0);
                    formulaCell(row, c.wcupA1 || 0,      c.wcupA2 || 0);
                });

                new DataTable('#ovechkin-assists', {
                    paging: false,
                    responsive: true,
                    order: [[ 1, 'desc' ]],
                    searching: false,
                    stateSave: false,
                    info: false,
                    columnDefs: [
                        { type: 'num', orderSequence: ['desc', 'asc'], targets: [1, 2, 3, 4, 5, 6] },
                        { orderable: false, targets: [0] }
                    ]
                });
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchDataAndCreateTable);
    </script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

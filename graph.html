    <meta property="og:description" content="A timeline of Ovechkin's NHL goals shows his complete career scoring arc.">

    <script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

  <body>
  <div class="container">
    <header class="my-4">
      <h1>Goal Graph</h1>
      <p>A timeline of Ovechkin's NHL goals shows his complete career scoring arc. Goals can be filtered with several available options.</p>
    </header>
    <main>
        <h2>All NHL Goals</h2>
        <div class="align-items-start align-items-sm-center d-flex flex-column flex-sm-row gap-1 justify-content-start my-3 small">
            <label for="combined-league">League</label>
            <select id="combined-league">
                <option value="">All</option>
                <option value="1">NHL Regular</option>
                <option value="2">NHL Playoffs</option>
            </select>
            <label for="combined-hoa">Home/Away</label>
            <select id="combined-hoa">
                <option value="">All</option>
                <option value="1">Home</option>
                <option value="0">Away</option>
            </select>
            <label for="combined-period">Period</label>
            <select id="combined-period">
                <option value="">All</option>
                <option value="1">First</option>
                <option value="2">Second</option>
                <option value="3">Third</option>
                <option value="4">Overtime</option>
            </select>
            <label for="combined-result">Win/Loss</label>
            <select id="combined-result">
                <option value="">All</option>
                <option value="1">Win</option>
                <option value="0">Loss</option>
            </select>
            <label for="combined-type">Type</label>
            <select id="combined-type">
                <option value="">All</option>
                <option value="Backhand">Backhand</option>
                <option value="Empty Net">Empty Net</option>
                <option value="Hat Trick">Hat Trick</option>
                <option value="Post">Post</option>
                <option value="Slapshot">Slapshot</option>
                <option value="Tip">Tip</option>
            </select>
        </div>
        <canvas id="combinedChart"></canvas>
    </main>
  </div>
  <footer class="align-items-start d-flex flex-column flex-sm-row gap-2 py-4 py-sm-3">
      <a href="/">Home</a>
      <span class="d-none d-sm-block">|</span>
      <a href="/about.html">About</a>
      <span class="d-none d-sm-block">|</span>
      <a href="/assists.html">Assists</a>
      <span class="d-none d-sm-block">|</span>
      <a href="/goalies.html">Goalies</a>
      <span class="d-none d-sm-block">|</span>
      <a href="/goals.html">Goals</a>
      <span class="d-none d-sm-block">|</span>
      <a href="/help.html">Help</a>
      <span class="d-none d-sm-block">|</span>
      <a href="/players.html">Players</a>
  </footer>
  <script>

    async function buildCharts() {
        try {
            const res = await fetch('/goals.json');
            const data = await res.json();

            const regular = data.filter(g => g.league === 1);
            const playoffs = data.filter(g => g.league === 2);

            const colors = {
                '': 'rgb(243, 65, 51)',
                '1': 'rgb(243, 65, 51)',
                '2': 'rgb(34, 54, 115)'
            };

            function toPoints(goals) {
                return goals.map((g, i) => ({
                    x: `${g.year}-${String(g.month).padStart(2, '0')}-${String(g.day).padStart(2, '0')}`,
                    y: i + 1,
                    team: g.team,
                    goalie: g.goalie
                }));
            }

            function getSource() {
                const league = document.getElementById('combined-league').value;
                if (league === '1') return regular;
                if (league === '2') return playoffs;
                return [...regular, ...playoffs].sort((a, b) => {
                    const da = new Date(a.year, a.month - 1, a.day);
                    const db = new Date(b.year, b.month - 1, b.day);
                    return da - db;
                });
            }

            const chart = new Chart(document.getElementById('combinedChart'), {
                type: 'line',
                data: {
                    datasets: [{
                        data: toPoints(getSource()),
                        borderColor: colors[''],
                        backgroundColor: 'rgba(243, 65, 51, 0.2)',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        fill: true,
                        tension: 0
                    }]
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'nearest', axis: 'x', intersect: false },
                    scales: {
                        x: {
                            type: 'time',
                            time: { unit: 'year', displayFormats: { year: 'yyyy' } },
                            title: { display: false }
                        },
                        y: { title: { display: true, text: 'Goals' }, beginAtZero: true }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title(items) {
                                    return new Date(items[0].raw.x).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                                },
                                label(item) { return ` #${item.raw.y}`; },
                                afterLabel(item) {
                                    const lines = [];
                                    if (item.raw.team) lines.push(`${item.raw.team}`);
                                    if (item.raw.goalie) lines.push(`${item.raw.goalie}`);
                                    return lines;
                                }
                            }
                        }
                    }
                }
            });

            function applyFilter() {
                const league = document.getElementById('combined-league').value;
                const hoa = document.getElementById('combined-hoa').value;
                const period = document.getElementById('combined-period').value;
                const result = document.getElementById('combined-result').value;
                const tag = document.getElementById('combined-type').value;
                let filtered = getSource();
                if (hoa !== '') filtered = filtered.filter(g => g.hoa === Number(hoa));
                if (period !== '') filtered = filtered.filter(g => g.period === Number(period));
                if (result !== '') filtered = filtered.filter(g => g.result === Number(result));
                if (tag) filtered = filtered.filter(g => [g.btn1, g.btn2, g.btn3].includes(tag));
                const color = colors[league];
                chart.data.datasets[0].borderColor = color;
                chart.data.datasets[0].backgroundColor = color.replace(')', ', 0.2)').replace('rgb', 'rgba');
                chart.data.datasets[0].data = toPoints(filtered);
                chart.update();
            }

            ['combined-league', 'combined-hoa', 'combined-period', 'combined-result', 'combined-type'].forEach(id =>
                document.getElementById(id).addEventListener('change', applyFilter)
            );

        } catch (err) {
            console.error('Error building charts:', err);
        }
    }

    document.addEventListener('DOMContentLoaded', buildCharts);
  </script>
  </body>
</html>

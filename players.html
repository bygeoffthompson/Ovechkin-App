    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K4X7EL6PW3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-K4X7EL6PW3');
    </script>
    <script>
        async function buildList() {
            try {
                const response = await fetch('/goals.json');
                const data = await response.json();

                const seen = new Set();
                const entries = [];
                data.forEach(item => {
                    if (!window.i18nLeague?.(item.league)) return;
                    for (const name of [item.goalie, item.a1, item.a2]) {
                        if (name && !seen.has(name)) {
                            seen.add(name);
                            entries.push({ name, league: item.league, month: item.month, day: item.day, year: item.year });
                        }
                    }
                });

                entries.sort((a, b) => (a.year * 10000 + a.month * 100 + a.day) - (b.year * 10000 + b.month * 100 + b.day));

                const tableBody = document.querySelector('tbody');
                entries.forEach(({ name, league, month, day, year }, index) => {
                    const row = tableBody.insertRow();

                    row.insertCell().textContent = index + 1;

                    const playerCell = row.insertCell();
                    const link = document.createElement('a');
                    link.textContent = name;
                    link.href = '/?' + name.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, '-');
                    playerCell.appendChild(link);

                    row.insertCell().textContent = window.i18nLeague(league);

                    const dateCell = row.insertCell();
                    dateCell.setAttribute('data-order', year * 10000 + month * 100 + day);
                    dateCell.innerHTML = `<small>${month}/${day}/${year}</small>`;
                });

                new DataTable('#ovechkin-players', {
                    paging: false,
                    responsive: true,
                    order: [[3, 'asc']],
                    searching: false,
                    stateSave: false,
                    info: false,
                    columnDefs: [
                        { type: 'num', orderSequence: ['asc', 'desc'], targets: [3] },
                        { orderable: false, targets: [0, 1, 2] }
                    ]
                });
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', buildList);
    </script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.3/js/dataTables.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.3/css/dataTables.dataTables.min.css">
  </head>
  <body>

    <header class="my-4">
      <h1 data-i18n="players-1">Players in the Ovechkin App</h1>
      <p data-i18n="players-2">A chronological list of every player in Ovechkin App.</p>
    </header>
    <main>
        <table id="ovechkin-players">
            <thead>

                    <th data-i18n="players-3">#</th>
                    <th data-i18n="players-4">Player</th>
                    <th data-i18n="players-5">League</th>
                    <th data-i18n="players-6">Date</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>
  </div>
  <footer class="align-items-start align-items-md-center d-flex flex-column flex-md-row gap-2 py-4 py-sm-3"></footer>
  <script src="/footer.js"></script>

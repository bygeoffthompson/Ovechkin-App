    <script>
        async function buildList() {
            try {
                const response = await fetch('/goals.json');
                const data = await response.json();

                const names = new Set();
                data.forEach(item => {
                    if (item.a1) names.add(item.a1);
                    if (item.a2) names.add(item.a2);
                    if (item.goalie) names.add(item.goalie);
                });

                const ol = document.querySelector('ol');
                [...names].sort((a, b) => a.localeCompare(b)).forEach(name => {
                    const li = document.createElement('li');
                    const link = document.createElement('a');
                    link.textContent = name;
                    link.href = '/?' + name.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, '-');
                    li.appendChild(link);
                    ol.appendChild(li);
                });
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', buildList);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        async function fetchDataAndRenderChart() {
            try {
                const votesSnap = await firebase.firestore().collection('goalVotes').get();
                const entries = [];
                votesSnap.forEach(doc => entries.push({ id: Number(doc.id), count: doc.data().count }));
                entries.sort((a, b) => b.count - a.count || a.id - b.id);
                const labels = entries.map(e => e.id);
                const data = entries.map(e => e.count);
                new Chart(document.getElementById('votes-chart'), {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Votes',
                            data,
                            backgroundColor: '#C81020',
                        }]
                    },
                    options: {
                        plugins: { legend: { display: false } },
                        scales: { y: { ticks: { precision: 0 } } }
                    }
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchDataAndRenderChart);
    </script>

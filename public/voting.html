    <script>
        async function fetchDataAndCreateTable() {
            try {
                const votesSnap = await firebase.firestore().collection('goalVotes').orderBy('count', 'desc').get();

                const tableBody = document.querySelector('tbody');
                votesSnap.forEach(doc => {
                    const goalId = doc.id;
                    const count = doc.data().count;
                    const row = tableBody.insertRow();
                    row.insertCell().innerHTML = `<a href="/?${goalId}">${goalId}</a>`;
                    row.insertCell().innerHTML = `<strong>${count}</strong>`;
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchDataAndCreateTable);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        async function fetchDataAndRenderChart() {
            try {
                const votesSnap = await firebase.firestore().collection('goalVotes').get();
                const entries = [];
                votesSnap.forEach(doc => entries.push({ id: Number(doc.id), count: doc.data().count }));
                entries.sort((a, b) => b.count - a.count || a.id - b.id);
                const medalColors = ['#EEBC1D', '#D6D6D6', '#977547'];
                const voteTrophy = document.getElementById('vote-trophy');
                entries.slice(0, 3).forEach((entry, i) => {
                    const a = document.createElement('a');
                    a.href = '/?' + entry.id;
                    a.className = 'position-relative vote-trophy';
                    a.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="${medalColors[i]}" class="bi bi-trophy-fill" viewBox="0 0 16 16"><path d="M2.5.5A.5.5 0 0 1 3 0h10a.5.5 0 0 1 .5.5q0 .807-.034 1.536a3 3 0 1 1-1.133 5.89c-.79 1.865-1.878 2.777-2.833 3.011v2.173l1.425.356c.194.048.377.135.537.255L13.3 15.1a.5.5 0 0 1-.3.9H3a.5.5 0 0 1-.3-.9l1.838-1.379c.16-.12.343-.207.537-.255L6.5 13.11v-2.173c-.955-.234-2.043-1.146-2.833-3.012a3 3 0 1 1-1.132-5.89A33 33 0 0 1 2.5.5m.099 2.54a2 2 0 0 0 .72 3.935c-.333-1.05-.588-2.346-.72-3.935m10.083 3.935a2 2 0 0 0 .72-3.935c-.133 1.59-.388 2.885-.72 3.935"/></svg><div class="fw-bold goal-trophy position-absolute start-0 text-center w-100">${entry.id}</div>`;
                    voteTrophy.appendChild(a);
                });
                const labels = entries.map(e => e.id);
                const data = entries.map(e => e.count);
                new Chart(document.getElementById('votes-chart'), {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Votes',
                            data,
                            backgroundColor: data.map((_, i) => {
                                if (i === 0) return '#EEBC1D';
                                if (i === 1) return '#D6D6D6';
                                if (i === 2) return '#977547';
                                return '#C81020';
                            }),
                        }]
                    },
                    options: {
                        plugins: { legend: { display: false } },
                        scales: { y: { ticks: { precision: 0 } } }
                    }
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchDataAndRenderChart);
    </script>
